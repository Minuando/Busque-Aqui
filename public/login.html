<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busque Aqui — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
    Busque<span>Aqui</span>
  </div>
  <div class="nav-r">
    <a href="index.html" class="btn btn-ghost btn-sm">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>
      Mapa
    </a>
  </div>
</nav>

<div class="app">
<div class="page active" style="flex:1;align-items:center;justify-content:center;">
  <div class="lcard">
    <div class="licon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <div class="ltitle">Acesso Administrativo</div>
    <div class="lsub">Credenciais definidas no arquivo .env</div>
    <div class="lerr" id="lerr">Usuário ou senha incorretos.</div>
    <div class="lform">
      <div class="fgroup"><label class="flabel">Usuário</label><input class="finput" id="lu" placeholder="admin" autocomplete="username"></div>
      <div class="fgroup"><label class="flabel">Senha</label><input class="finput" id="lp" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-accent" id="btn-login" onclick="doLogin()" style="justify-content:center;padding:10px">Entrar</button>
    </div>
  </div>
</div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg class="ti" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="toast-icon"></svg>
  <span id="toast-msg"></span>
</div>

<script>
'use strict';

async function api(method, path, body) {
  const h = { 'Content-Type': 'application/json' };
  const res = await fetch(`/api${path}`, {
    method, headers: h,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
const POST = (p,b) => api('POST', p, b);

async function doLogin() {
  const username = document.getElementById('lu').value.trim();
  const password = document.getElementById('lp').value;
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  try {
    const d = await POST('/auth/login', { username, password });
    // Armazena token em sessionStorage para uso no dashboard
    sessionStorage.setItem('token', d.token);
    sessionStorage.setItem('authUser', d.username);
    sessionStorage.setItem('authId', d.id);
    document.getElementById('lerr').style.display = 'none';
    window.location.href = 'admin.html';
  } catch {
    document.getElementById('lerr').style.display = 'block';
    document.getElementById('lp').value = '';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
}

// ════════════════════════════════════════
//  TOAST
// ════════════════════════════════════════
let toastTimer;
function showToast(msg, type='success') {
  const t   = document.getElementById('toast');
  const ico = document.getElementById('toast-icon');
  document.getElementById('toast-msg').textContent = msg;
  t.className = `toast ${type}`;
  ico.innerHTML = type === 'success'
    ? '<polyline points="20 6 9 17 4 12"/>'
    : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
  requestAnimationFrame(() => t.classList.add('show'));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// Redireciona se já está logado
document.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('token')) {
    window.location.href = 'admin.html';
  }
});
</script>
</body>
</html>
